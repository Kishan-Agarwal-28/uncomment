# Languages are matched by file extension.
# Add your own entries here or supply a --langs file at runtime.
# Rules are: line_comments, block_comments, strings.
# String delimiters: longer ones are tried first (""" before ").

# ── C-family ──────────────────────────────────────────────────────────────────

[[language]]
name = "C / C++"
extensions = ["c", "h", "cpp", "cc", "cxx", "hpp", "hxx"]
line_comments = ["//"]
block_comments = [["/*", "*/"]]

[[language.strings]]
open = "\""
close = "\""
escape = true
multiline = false

[[language.strings]]
open = "'"
close = "'"
escape = true
multiline = false
char_literal = true  # C char literals: 'x', '\n', '\0' etc.

# ── Rust ──────────────────────────────────────────────────────────────────────

[[language]]
name = "Rust"
extensions = ["rs"]
line_comments = ["//"]
block_comments = [["/*", "*/"]]
raw_strings = true

[[language.strings]]
open = "\"\"\""
close = "\"\"\""
escape = false
multiline = true

[[language.strings]]
open = "\""
close = "\""
escape = true
multiline = false

[[language.strings]]
open = "'"
close = "'"
escape = true
multiline = false
char_literal = true  # prevents 'a lifetime annotations from being misread

