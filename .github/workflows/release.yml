name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  # ── Change these two to match your crate ──────────────────────────────────
  BIN_NAME: uncomment          # the binary name produced by `cargo build`
  CRATE_NAME: uncomment        # matches [package].name in Cargo.toml
  # ─────────────────────────────────────────────────────────────────────────

permissions:
  contents: write   # needed to create GitHub releases & upload assets

jobs:
  # ─── 1. Build binaries for every target ───────────────────────────────────
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (used by apt)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            cross: true

          # macOS (used by Homebrew)
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14        # M-series runner
            archive: tar.gz

          # Windows (used by Chocolatey)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross is a drop-in replacement for `cargo` for cross-compilation
      - name: Install cross (aarch64 Linux only)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      # ── Package ─────────────────────────────────────────────────────────
      - name: Package (tar.gz — Linux/macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ASSET="${{ env.BIN_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          cp README.md LICENSE "target/${{ matrix.target }}/release/"
          tar -czf "$ASSET" -C "target/${{ matrix.target }}/release" "${{ env.BIN_NAME }}" README.md LICENSE
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Package (zip — Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "${{ env.BIN_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Copy-Item "README.md", "LICENSE" -Destination "target\${{ matrix.target }}\release\"
          Compress-Archive `
            -Path "target\${{ matrix.target }}\release\${{ env.BIN_NAME }}.exe",`
                  "target\${{ matrix.target }}\release\README.md",`
                  "target\${{ matrix.target }}\release\LICENSE" `
            -DestinationPath $asset
          echo "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compute SHA-256
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ASSET" | awk '{print $1}' > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" | awk '{print $1}' > "$ASSET.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  # ─── 2. Create GitHub release & attach all assets ────────────────────────
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: deploy
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**

  # ─── 3. Build & publish .deb (apt) ───────────────────────────────────────
  apt:
    name: Publish .deb (apt)
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb
        run: cargo deb

      # Upload the .deb to GitHub Releases for direct downloads
      - name: Upload .deb to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb

      # Pass the .deb to the next job to build an apt repo
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: target/debian/*.deb

  # ─── 3.5. Host an apt repository on GitHub Pages ─────────────────────────
  apt-repo:
    name: Publish to gh-pages apt repo
    needs: apt
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      contents: write # Needed to commit to gh-pages
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
        # If gh-pages doesn't exist, this step will fail. Ensure you've created a gh-pages branch!

      - name: Download .deb package
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: pool/main/

      - name: Generate APT repository metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils
          
          # Generate Packages file
          dpkg-scanpackages --multiversion pool/ > Packages
          gzip -k -f Packages
          
          # Generate Release file
          apt-ftparchive release . > Release

      - name: Commit and push APT repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update apt repository with new release"
          branch: gh-pages

  # ─── 4. Bump Homebrew formula ─────────────────────────────────────────────
  homebrew:
    name: Bump Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Download macOS arm64 SHA
        uses: actions/download-artifact@v4
        with:
          name: aarch64-apple-darwin
          path: artifacts

      - name: Download macOS x64 SHA
        uses: actions/download-artifact@v4
        with:
          name: x86_64-apple-darwin
          path: artifacts

      - name: Read SHAs
        id: shas
        run: |
          ARM=$(cat artifacts/${{ env.BIN_NAME }}-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz.sha256)
          X64=$(cat artifacts/${{ env.BIN_NAME }}-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz.sha256)
          echo "arm=$ARM" >> "$GITHUB_OUTPUT"
          echo "x64=$X64" >> "$GITHUB_OUTPUT"

      # Bumps the formula in your homebrew-tap repo automatically.
      # Set HOMEBREW_TAP_TOKEN to a PAT with repo write access to that repo.
      - name: Bump formula in tap
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: ${{ env.BIN_NAME }}
          formula-path: Formula/${{ env.BIN_NAME }}.rb
          homebrew-tap: Kishan-Agarwal-28/homebrew-tap 
          tag-name: ${{ github.ref_name }}
          download-url: >-
            https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.BIN_NAME }}-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # ─── 5. Push to Chocolatey ────────────────────────────────────────────────
  chocolatey:
    name: Publish to Chocolatey
    needs: release
    runs-on: windows-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: artifacts

      - name: Read SHA256
        id: sha
        shell: pwsh
        run: |
          $sha = Get-Content "artifacts\${{ env.BIN_NAME }}-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip.sha256"
          echo "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Write dynamic chocolateyInstall.ps1
        shell: pwsh
        run: |
          $version  = "${{ needs.release.outputs.version }}"
          $sha      = "${{ steps.sha.outputs.sha }}"
          $url      = "https://github.com/${{ github.repository }}/releases/download/v${version}/${{ env.BIN_NAME }}-v${version}-x86_64-pc-windows-msvc.zip"

          (Get-Content chocolatey\tools\chocolateyInstall.ps1.tpl) `
            -replace '__VERSION__', $version `
            -replace '__URL__',     $url `
            -replace '__SHA256__',  $sha |
            Set-Content chocolatey\tools\chocolateyInstall.ps1

      - name: Pack & push
        shell: pwsh
        run: |
          $version = "${{ needs.release.outputs.version }}"
          choco pack chocolatey\${{ env.CRATE_NAME }}.nuspec --version $version
          choco push ${{ env.CRATE_NAME }}.${version}.nupkg `
            --source https://push.chocolatey.org `
            --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
